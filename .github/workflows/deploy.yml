name: Deploy to homelab

on:
  workflow_dispatch:

concurrency:
  group: deploy-homelab
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_PREFIX: dev-challenge-gis

jobs:
  build:
    if: github.ref == 'refs/heads/challenge/gis'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter @dev-prep/web build
        env:
          VITE_BASE_PATH: /${{ env.APP_PREFIX }}/

      # Writes env-config.js from the MAP_HOST repository variable (the map host needs CORS, Timing-Allow-Origin and Range).
      # BUILD_COMMIT and BUILD_REPO_URL come from the GitHub context and show the deployed commit in the app.
      - name: Generate runtime env-config.js
        env:
          MAP_HOST: ${{ vars.MAP_HOST }}
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          : "${MAP_HOST:?MAP_HOST repository variable is not set}"
          node -e 'require("node:fs").writeFileSync("apps/web/dist/env-config.js", "window.__ENV__ = " + JSON.stringify({ MAP_HOST: process.env.MAP_HOST, BUILD_COMMIT: process.env.BUILD_COMMIT, BUILD_REPO_URL: process.env.BUILD_REPO_URL }) + ";\n")'
          grep -q '"MAP_HOST"' apps/web/dist/env-config.js
          grep -q '"BUILD_COMMIT"' apps/web/dist/env-config.js
          grep -q '"BUILD_REPO_URL"' apps/web/dist/env-config.js

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/challenge/gis'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - uses: AnimMouse/setup-cloudflared@v2

      - run: cloudflared --version

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.HOMELAB_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOMELAB_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.HOMELAB_SSH_HOST }}
          SSH_USER: ${{ secrets.HOMELAB_SSH_USER }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/homelab
          chmod 600 ~/.ssh/homelab
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host homelab
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/homelab
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ProxyCommand cloudflared access ssh --hostname %h
          EOF
          ssh homelab true

      - name: Copy build to homelab
        env:
          MOUNT_PATH: ${{ vars.BASE_MOUNT_PATH }}
        run: |
          set -euo pipefail
          : "${MOUNT_PATH:?BASE_MOUNT_PATH variable is not set}"
          target="${MOUNT_PATH%/}/${APP_PREFIX}"
          q_target=$(printf '%q' "$target")

          ssh homelab "mkdir -p $q_target"
          rsync -az --delete dist/ "homelab:$target/"
          ssh homelab "test -f $q_target/index.html"
          echo "Deployed to https://landing-stage.longngphuc.id.vn/${APP_PREFIX}/"
